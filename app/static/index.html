<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krishi RAG</title>
  <style>
    :root { --bg: #fbfaf6; --fg: #1d2a1f; --muted: #5b6b5e; --line: #d9ddd3; --accent: #2f6b3a; --error: #9b2c2c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141a15; --fg: #e6ece4; --muted: #a3b2a5; --line: #2c372e; --accent: #7cc48a; --error: #f09b9b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    p.lead { margin: 0 0 1.5rem; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    textarea { width: 100%; min-height: 5.5rem; padding: .7rem; font: inherit; color: inherit;
               background: transparent; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
    button { margin-top: .75rem; padding: .6rem 1.2rem; font: inherit; font-weight: 600; color: var(--bg);
             background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #result { margin-top: 2rem; }
    #answer { white-space: pre-wrap; }
    .error { color: var(--error); }
    .meta { color: var(--muted); font-size: .9rem; }
    ol { padding-left: 1.4rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Krishi RAG</h1>
  <p class="lead">Ask about crop practices or farm schemes (PM-KISAN, PMFBY). Answers come only from official documents and cite the page. You can ask in English or Hindi.</p>

  <form id="ask">
    <label for="question">Your question</label>
    <textarea id="question" name="question" minlength="3" maxlength="500" required
              placeholder="What is the seed rate for bottle gourd?"></textarea>
    <button type="submit">Ask</button>
  </form>

  <section id="result" aria-live="polite" hidden>
    <h2>Answer</h2>
    <p id="answer"></p>
    <div id="sources" hidden>
      <h3>Sources</h3>
      <ol id="source-list"></ol>
    </div>
    <p class="meta" id="meta"></p>
  </section>
</main>
<script>
  const form = document.getElementById("ask");
  const button = form.querySelector("button");
  const $ = (id) => document.getElementById(id);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = $("question").value.trim();
    if (question.length < 3) return;
    button.disabled = true;
    button.textContent = "Thinking…";
    $("result").hidden = false;
    $("answer").className = "";
    $("answer").textContent = "";
    $("sources").hidden = true;
    $("meta").textContent = "";
    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please check your question and try again.");
      $("answer").textContent = data.answer;
      const list = $("source-list");
      list.replaceChildren();
      for (const c of data.citations) {
        const item = document.createElement("li");
        item.value = c.n;
        const text = `${c.title}, page ${c.page}`;
        if (c.url) {
          const link = document.createElement("a");
          link.href = `${c.url}#page=${c.page}`;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = text;
          item.append(link);
        } else {
          item.textContent = text;
        }
        list.append(item);
      }
      $("sources").hidden = data.citations.length === 0;
      $("meta").textContent = `${data.cached ? "From cache" : "Answered"} in ${(data.latency_ms / 1000).toFixed(1)} s`;
    } catch (error) {
      $("answer").className = "error";
      $("answer").textContent = error.message || "Something went wrong. Please try again.";
    } finally {
      button.disabled = false;
      button.textContent = "Ask";
    }
  });

  // Shareable links: /?q=your+question fills the box and asks it.
  const shared = new URLSearchParams(location.search).get("q");
  if (shared) {
    $("question").value = shared.slice(0, 500);
    form.requestSubmit();
  }
</script>
</body>
</html>

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: krishi
      # Only applied when the volume is first created; changing it later does not change the DB.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishi}
      POSTGRES_DB: krishi
    ports:
      - "5433:5432"  # 5433 so it doesn't clash with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:

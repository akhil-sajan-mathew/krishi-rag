[project]
name = "krishi-rag"
version = "0.1.0"
description = "RAG question-answering over Indian agriculture and government-scheme documents"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "llama-index-core>=0.12",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false
link-mode = "copy"  # NLTK (used by llama-index) refuses hardlinked data files, uv's default on Windows

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

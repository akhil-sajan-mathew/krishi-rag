[project]
name = "krishi-rag"
version = "0.1.0"
description = "RAG question-answering over Indian agriculture and government-scheme documents"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "llama-index-core>=0.12",
    "sentence-transformers>=3.0",
    "torch>=2.4",  # direct so [tool.uv.sources] can pick the CPU build on Linux
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
    "openai>=1.50",
    "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false
link-mode = "copy"  # NLTK (used by llama-index) refuses hardlinked data files, uv's default on Windows

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

# CPU-only PyTorch on Linux (CI, Docker): the default wheel bundles ~2.5 GB of unused CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
